name: Build & Release GoSwitcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (Inno Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Extract version from tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') {
            $ver = $Matches[1]
          } else {
            $ver = "1.2.0"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Train AI model if missing
        shell: pwsh
        run: |
          go mod tidy
          if (-not (Test-Path "model.json") -and (Test-Path "words_ru.txt") -and (Test-Path "words_en.txt")) {
            go run . -learn
          }

      - name: Build GoSwitcher.exe (Windows GUI)
        shell: pwsh
        run: |
          go build -ldflags="-s -w -H=windowsgui" -trimpath -o GoSwitcher.exe .

      - name: Install Inno Setup & Compile Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          (Get-Content setup.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"${{ steps.meta.outputs.version }}`"" | Set-Content setup.iss
          & $iscc setup.iss

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            GoSwitcher.exe

  build-linux-rpm:
    name: Build Linux RPM (openSUSE Tumbleweed)
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest
    steps:
      - name: Install build dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install -y \
            go \
            rpm-build \
            libayatana-appindicator3-devel \
            gtk3-devel \
            udev \
            systemd-rpm-macros \
            tar \
            gzip \
            git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.2.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare vendor, model & RPM sources
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          go mod tidy
          go mod vendor

          if [ ! -f "model.json" ] && [ -f "words_ru.txt" ] && [ -f "words_en.txt" ]; then
            go run . -learn
          fi

          # Актуализируем версию в spec-файле под текущий тег
          sed -i "s/^Version:.*/Version:        ${VERSION}/" goswitcher.spec

          mkdir -p /tmp/pkg/goswitcher-${VERSION}
          cp -r main.go ai.go hook_linux.go platform_linux.go go.mod go.sum vendor web icon.ico /tmp/pkg/goswitcher-${VERSION}/
          [ -f "model.json" ] && cp model.json /tmp/pkg/goswitcher-${VERSION}/
          [ -f "words_ru.txt" ] && cp words_ru.txt /tmp/pkg/goswitcher-${VERSION}/
          [ -f "words_en.txt" ] && cp words_en.txt /tmp/pkg/goswitcher-${VERSION}/

          # Используем стандартные системные пути openSUSE для rpmbuild
          mkdir -p /usr/src/packages/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar -czf /usr/src/packages/SOURCES/goswitcher-${VERSION}.tar.gz -C /tmp/pkg goswitcher-${VERSION}
          cp goswitcher.spec /usr/src/packages/SPECS/

      - name: Build RPM package
        run: |
          rpmbuild -ba /usr/src/packages/SPECS/goswitcher.spec
          mkdir -p release-linux
          cp /usr/src/packages/RPMS/x86_64/*.rpm release-linux/

      - name: Upload Linux RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-artifacts
          path: release-linux/*.rpm

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./artifacts

      - name: Download Linux RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm-artifacts
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*
